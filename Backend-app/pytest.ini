[pytest]
# Tell pytest where to find tests
testpaths = tests

# Show short traceback for cleaner output; use --tb=long when debugging
addopts = --tb=short -q

# Treat these warnings as errors so they never silently accumulate
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:sqlalchemy
    ignore::DeprecationWarning:pydantic